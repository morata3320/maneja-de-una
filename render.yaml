services:
  - type: web
    name: maneja-de-una-api-mdu
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: cd apps/api && npm ci --include=dev && npm run build
    startCommand: cd apps/api && npm run start:render
    healthCheckPath: /api/v2/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: maneja-de-una-pg.postgres.database.azure.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: maneja_de_una
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGINS
        value: https://maneja-de-una-web-mdu.onrender.com
      - key: INTERNAL_JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: PAGINATION_SECRET
        generateValue: true
      - key: WEBHOOK_ENCRYPTION_KEY
        sync: false
      - key: AUTH_MODE
        value: local
      - key: AUTOS_LOCAL_JWT_SECRET
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: RUN_CATALOG_SEED
        value: "false"
      - key: WEBHOOK_WORKER_ENABLED
        value: "false"
      - key: WEBHOOK_ALLOW_LOOPBACK
        value: "false"
  - type: web
    name: maneja-de-una-v3-api
    runtime: node
    plan: free
    region: ohio
    branch: feature/rda2-v2-integracion
    rootDir: apps/api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/v3/autos/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: maneja-de-una-v3-pg
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: CORS_ORIGINS
        value: https://maneja-de-una-web-mdu.onrender.com
      - key: INTERNAL_JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: PAGINATION_SECRET
        generateValue: true
      - key: WEBHOOK_ENCRYPTION_KEY
        sync: false
      - key: AUTH_MODE
        value: local
      - key: AUTH_ISSUER
        value: urn:autos:local
      - key: AUTH_AUDIENCE
        value: autos-api
      - key: AUTOS_LOCAL_JWT_SECRET
        generateValue: true
      - key: BOOKING_API_KEY
        generateValue: true
      - key: AUTOS_NODE_ID
        value: maneja-de-una
      - key: RUN_CATALOG_SEED
        value: "true"
      - key: STOCK_SYNC_ENABLED
        value: "false"
      - key: BOOKING_GRPC_TLS
        value: "false"
      - key: WEBHOOK_WORKER_ENABLED
        value: "false"
      - key: WEBHOOK_ALLOW_LOOPBACK
        value: "false"
      - key: SEARCH_TOKEN_TTL_MINUTES
        value: "15"
      - key: HOLD_TTL_MINUTES
        value: "10"
      - key: PREVIEW_TTL_MINUTES
        value: "15"
  - type: web
    name: maneja-de-una-web-mdu
    runtime: static
    branch: main
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        value: https://maneja-de-una-api-mdu.onrender.com/api/v2
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: maneja-de-una-v3-pg
    plan: free
    region: ohio
    databaseName: maneja_de_una_v3
    user: maneja_de_una_v3
